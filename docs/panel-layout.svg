<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="t">
  <title id="t">Layout of the reel: graphic on a light stage, caption above the head, speaker in a panel on the bottom third with the head rising above its edge</title>
  <defs>
    <clipPath id="graphic"><rect x="36" y="48" width="260" height="170" rx="12"/></clipPath>
    <clipPath id="frame"><rect x="20" y="20" width="292" height="520" rx="18"/></clipPath>
    <clipPath id="panel"><path d="M20 366 a22 22 0 0 1 22 -22 H290 a22 22 0 0 1 22 22 V540 H20 Z"/></clipPath>
  </defs>
  <rect width="560" height="560" rx="20" fill="#FFFDF9"/>
  <g clip-path="url(#frame)">
    <rect x="20" y="20" width="292" height="520" fill="#F5F1EA"/>
    <rect x="36" y="48" width="260" height="170" rx="12" fill="#0B7A73"/>
    <path clip-path="url(#graphic)" d="M36 218 L118 136 L170 182 L216 142 L296 212 V218 Z" fill="#075450"/>
    <circle cx="246" cy="88" r="18" fill="#D7ECE8"/>
    <rect x="86" y="240" width="160" height="22" rx="4" fill="#17140F"/>
    <g clip-path="url(#panel)">
      <rect x="20" y="344" width="292" height="196" fill="#A5532B"/>
      <rect x="20" y="452" width="292" height="88" fill="#1F4A44"/>
    </g>
    <path d="M58 540 C66 492 112 482 136 474 H196 C220 482 266 492 274 540 Z" fill="#ECE6DC"/>
    <rect x="142" y="430" width="48" height="56" fill="#5B3A29"/>
    <ellipse cx="166" cy="372" rx="66" ry="86" fill="#5B3A29"/>
    <path d="M100 366 C96 306 126 284 166 284 C206 284 236 306 232 366 C222 330 204 322 166 322 C128 322 110 330 100 366 Z" fill="#17140F"/>
  </g>
  <rect x="20" y="20" width="292" height="520" rx="18" fill="none" stroke="#17140F" stroke-opacity=".18" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#17140F">
    <g stroke="#746D62" stroke-width="1.5" stroke-dasharray="3 4">
      <line x1="300" y1="130" x2="340" y2="130"/>
      <line x1="250" y1="251" x2="340" y2="251"/>
      <line x1="222" y1="318" x2="340" y2="318"/>
      <line x1="312" y1="440" x2="340" y2="440"/>
    </g>
    <text x="348" y="122" font-size="17" font-weight="700">Light stage</text>
    <text x="348" y="143" font-size="14" fill="#746D62">a new graphic every 2–3 s</text>
    <text x="348" y="247" font-size="17" font-weight="700">Caption</text>
    <text x="348" y="267" font-size="14" fill="#746D62">1–3 words, above the head</text>
    <text x="348" y="312" font-size="17" font-weight="700">Head</text>
    <text x="348" y="332" font-size="14" fill="#746D62">rises above the panel's edge</text>
    <text x="348" y="436" font-size="17" font-weight="700">Face panel</text>
    <text x="348" y="456" font-size="14" fill="#746D62">the bottom third of the frame,</text>
    <text x="348" y="474" font-size="14" fill="#746D62">your real background</text>
  </g>
</svg>
